// This file contains Dove's "user" prefs, as it's not really possible to set those with the standard `.js` pref files
// See `dove-unified.js` (or `dove.js`/`dove-desktop.js` if you're looking at this locally...) for info on these prefs/why they're included.

// Determine our platform
/// See: https://codeberg.org/celenity/Phoenix/issues/231 - in the future, we'll likely use these to ship a single, unified .cfg
/// file for all platforms
defaultPref("mail.dove.platform", "unknown");
defaultPref("mail.dove.platform.current", "unknown");
defaultPref("mail.dove.platformSet", false);

try {
    // First, check the value of DOVE_HOST_PLATFORM
    if (getenv("DOVE_HOST_PLATFORM") == "linux") {
        DOVE_PLATFORM = 'linux'
    // For now, we don't really need to distinguish between OS X and OS X Intel
    } else if (getenv("DOVE_HOST_PLATFORM") == "osx" || getenv("DOVE_HOST_PLATFORM") == "osx-intel") {
        DOVE_PLATFORM = 'osx'
    } else if (getenv("DOVE_HOST_PLATFORM") == "windows") {
        DOVE_PLATFORM = 'windows'

    // Now, fall-back to system env variables...

    // If any of the following env variables are defined, we know we're on OS X:
    // __CFBundleIdentifier
    // MOZ_APP_NO_DOCK
    // MOZ_NO_GLOBAL_MOUSE_MONITOR
    // XPC_FLAGS
    // XPC_SERVICE_NAME
    } else if (getenv("__CFBundleIdentifier") || getenv("MOZ_APP_NO_DOCK") || getenv("MOZ_NO_GLOBAL_MOUSE_MONITOR") || getenv("XPC_FLAGS") || getenv("XPC_SERVICE_NAME")) {
        DOVE_PLATFORM = 'osx'
    // If any of the following env variables are defined, we know we're on Windows:
    // MOZ_ENABLE_WIN32K
    // USERPROFILE
    // XRE_NO_DLL_READAHEAD
    // XRE_NO_WINDOWS_CRASH_DIALOG
    } else if (getenv("MOZ_ENABLE_WIN32K") || getenv("USERPROFILE") || getenv("XRE_NO_DLL_READAHEAD") || getenv("XRE_NO_WINDOWS_CRASH_DIALOG")) {
        DOVE_PLATFORM = 'windows'
    // If any of the following env variables are defined, we know we're on Linux:
    // DESKTOP_SESSION
    // GDK_BACKEND
    // GDMSESSION
    // GNOME_DESKTOP_SESSION_ID
    // GTK_USE_PORTAL
    // KDE_FULL_SESSION
    // LXQT_SESSION_CONFIG
    // MATE_DESKTOP_SESSION_ID
    // MOZ_DISABLE_WAYLAND_PROXY
    // MOZ_GDK_DISPLAY
    // MOZ_USE_XINPUT2
    // MOZ_X_SYNC
    // MOZ_X11_EGL
    // SNAP
    // SNAP_DESKTOP_RUNTIME
    // SNAP_INSTANCE_NAME
    // SNAP_NAME
    // SNAP_REAL_HOME
    // SYSTEMD_EXEC_PID
    // WAYLAND_DISPLAY
    // WAYLAND_PROXY_LOG
    // XDG_ACTIVATION_TOKEN
    // XDG_CACHE_HOME
    // XDG_CONFIG_DIRS
    // XDG_CONFIG_HOME
    // XDG_CURRENT_DESKTOP
    // XDG_DATA_DIRS
    // XDG_DATA_HOME
    // XDG_MENU_PREFIX
    // XDG_RUNTIME_DIR
    // XDG_SESSION_CLASS
    // XDG_SESSION_DESKTOP
    // XDG_SESSION_TYPE
    } else if (getenv("DESKTOP_SESSION") || getenv("GDK_BACKEND") || getenv("GDMSESSION") || getenv("GNOME_DESKTOP_SESSION_ID") || getenv("GTK_USE_PORTAL") || getenv("KDE_FULL_SESSION") || getenv("LXQT_SESSION_CONFIG") || getenv("MATE_DESKTOP_SESSION_ID") || getenv("MOZ_DISABLE_WAYLAND_PROXY") || getenv("MOZ_GDK_DISPLAY") || getenv("MOZ_USE_XINPUT2") || getenv("MOZ_X_SYNC") || getenv("MOZ_X11_EGL") || getenv("SNAP") || getenv("SNAP_DESKTOP_RUNTIME") || getenv("SNAP_INSTANCE_NAME") || getenv("SNAP_NAME") || getenv("SNAP_REAL_HOME") || getenv("SYSTEMD_EXEC_PID") || getenv("WAYLAND_DISPLAY") || getenv("WAYLAND_PROXY_LOG") || getenv("XDG_ACTIVATION_TOKEN") || getenv("XDG_CACHE_HOME") || getenv("XDG_CONFIG_DIRS") || getenv("XDG_CONFIG_HOME") || getenv("XDG_CURRENT_DESKTOP") || getenv("XDG_DATA_DIRS") || getenv("XDG_DATA_HOME") || getenv("XDG_MENU_PREFIX") || getenv("XDG_RUNTIME_DIR") || getenv("XDG_SESSION_CLASS") || getenv("XDG_SESSION_DESKTOP") || getenv("XDG_SESSION_TYPE")) {
        DOVE_PLATFORM = 'linux'
    // At this point, we should really have our OS, but in case we don't for some reason, check prefs
    // In practice, these shouldn't be used
    } else if (getPref("browser.low_commit_space_threshold_percent") || getPref("media.ffmpeg.vaapi.force-surface-zero-copy") || getPref("widget.gtk.file-manager-show-items-timeout-ms")) {
        DOVE_PLATFORM = 'linux'
    } else if (getPref("network.dns.native_https_timeout_mac_msec") || getPref("widget.macos.shift-by-menubar-on-fullscreen") || getPref("widget.macos.automatic.text_substitution_fetch_length")) {
        DOVE_PLATFORM = 'osx'
    } else if (getPref("accessibility.windows.suppress-after-clipboard-copy") || getPref("accessibility.windows.suppress-for-snap-layout")) {
        DOVE_PLATFORM = 'windows'
    } else {
        DOVE_PLATFORM = 'unknown'
    }
} catch (e) {
    DOVE_PLATFORM = 'unknown'
};

pref("mail.dove.platform.current", `${DOVE_PLATFORM}`);
dovePlatformPrefCurrentValue = getPref("mail.dove.platform.current");

if (getPref("mail.dove.platformSet") == false || getPref("mail.dove.platform") == "unknown") {
    pref("mail.dove.platform", `${dovePlatformPrefCurrentValue}`);
    pref("mail.dove.platformSet", true); 
};

/// So, on first run, to grant ATN-XPIHandler permission to access addons.thunderbird.net,
// we unfortunately need to enable granting MV3 extensions optional host permissions by default.
// But we only need this for the first run, since once the permission is granted, it will persist.
// Additionally, `browser.search.region` usually gets set as a `user` value, so we need to reset it as well
// Smooth scrolling (`general.smoothScroll`) is a similar weird case - we do attempt to enable it by default, but due to us disabling UI animations,
// Thunderbird disables it anyways - so, to work around that, we can set it as a user pref on first launch
defaultPref("mail.dove.firstRun.complete", false);

if (getPref("mail.dove.firstRun.complete") == false) {
    clearPref("browser.search.region");
    defaultPref("extensions.originControls.grantByDefault", true);
    pref("general.smoothScroll", true);
    pref("mail.dove.firstRun.complete", true);
};

/// So, CRLite is currently broken with Thunderbird's Remote Settings (meaning we unfortunately still need OCSP),
// but it does work if users set the MOZ_REMOTE_SETTINGS_DEVTOOLS env variable and set the server to Firefox's
// (https://firefox.settings.services.mozilla.com/v1). At some point, we need to figure out if we can set MOZ_REMOTE_SETTINGS_DEVTOOLS directly
// But, for now, we can manually check whether the env and prefs are set; and if so, disable OCSP accordingly
// NOTE: Nightly doesn't require setting "MOZ_REMOTE_SETTINGS_DEVTOOLS" here
if ((getenv("MOZ_REMOTE_SETTINGS_DEVTOOLS") == 1 || getPref("app.update.channel") == "nightly") && (getPref("services.settings.server") == "https://firefox.settings.services.mozilla.com/v1")) {
    defaultPref("security.OCSP.enabled", 0);
    defaultPref("security.OCSP.require", false);
};

