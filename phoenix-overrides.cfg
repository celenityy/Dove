// Dove overrides for Phoenix-specific preferences...

// Re-enable the `CanvasExtractionBeforeUserInputIsBlocked` FPP target
/// Unlike Phoenix/Firefox, Dove/Thunderbird doesn't support the permission prompts for canvas data extraction, so
/// there's no reason not to set it here
defaultPref("browser.phoenix.fingerprintingProtection.global.consumerOverrides", "+CanvasExtractionBeforeUserInputIsBlocked");

// Reset the preference to enable add-on installation per-session
/// Thunderbird usually doesn't display a prompt to re-enable this functionality when its disabled, but
/// our ATN-XPIHandler add-on fixes it and allows the prompt to work as expected
defaultPref("browser.phoenix.reset.xpinstall.enabled", true);
