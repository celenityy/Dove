//
// The Phoenix shall be followed by a Dove: one of great strength and great beauty, to help carry out its conquest.

// Built from Phoenix (Hardened)

lockPref("general.config.filename", "dove.cfg");
lockPref("general.config.vendor", "dove");

lockPref("mail.dove.version", "2025.01.14.1");

// 000 RESET UNDESIRED PREFS FROM PHOENIX

defaultPref("app.releaseNotesURL", "https://live.thunderbird.net/%APP%/releasenotes?locale=%LOCALE%&version=%VERSION%&channel=%CHANNEL%&os=%OS%&buildid=%APPBUILDID%");
defaultPref("app.releaseNotesURL.aboutDialog", "https://live.thunderbird.net/%APP%/releasenotes?locale=%LOCALE%&version=%VERSION%&channel=%CHANNEL%&os=%OS%&buildid=%APPBUILDID%");
defaultPref("app.releaseNotesURL.prompt", "https://live.thunderbird.net/%APP%/releasenotes?locale=%LOCALE%&version=%VERSION%&channel=%CHANNEL%&os=%OS%&buildid=%APPBUILDID%");

/// Required for extensions from the ATO

defaultPref("privacy.resistFingerprinting.block_mozAddonManager", false);

/// Unbreak extensions...

unlockPref("xpinstall.signatures.required");
defaultPref("xpinstall.signatures.required", false);

lockPref("mail.dove.cfg.status", "000");

// 001 TELEMETRY

lockPref("toolkit.telemetry.ecosystemtelemetry.enabled", false); // [DEFAULT for non-Nightly...]

lockPref("mail.dove.cfg.status", "001");

// 002 MOZILLA CRAP

/// Disable Mozilla Email Provisioner/Creating new email addresses with their "partners"

defaultPref("mail.provider.enabled", false);

/// Never check default mail client

defaultPref("mail.shell.checkDefaultClient", false);

/// Skip Onboarding

defaultPref("mail.rights.override", true);
defaultPref("mailnews.start_page_override.mstone", "ignore");

/// Disable Start Page by default & switch the URL to the about:config
// This allows users to easily access the about:config via the menu bar from Go -> Mail Start Page
// Or by pressing alt + home

defaultPref("mailnews.start_page.enabled", false);
defaultPref("mailnews.start_page.override_url", "");
defaultPref("mailnews.start_page.url", "about:config");

/// Disable Donate Prompts
// Please still donate to Thunderbird if you appreciate it! ;)
// https://www.thunderbird.net/?form=support

lockPref("app.donation.eoy.url", "");
lockPref("app.donation.eoy.version.viewed", 999);

/// Disable Filelink
// https://support.mozilla.org/kb/filelink-large-attachments

defaultPref("mail.cloud_files.enabled", false);

/// Disable "Chat" functionality

defaultPref("mail.chat.enabled", false);

/// Kill Add-on "Discovery" Recommendations

defaultPref("extensions.getAddons.recommended.url", "");

/// Remove unnecessary URL params

defaultPref("extensions.getAddons.search.browseURL", "https://addons.thunderbird.net/%LOCALE%/%APP%/search/?q=%TERMS%");

lockPref("mail.dove.cfg.status", "002");

// 003 DISK AVOIDANCE

/// Disable caching

defaultPref("mail.imap.use_disk_cache2", false);

/// Set website permissions to be session only

defaultPref("permissions.memory_only", true);

/// Fully disable browsing history

defaultPref("places.history.enabled", false);

/// Sanitize cookies on exit

defaultPref("network.cookie.noPersistentStorage", true);

/// Disable logging chat history
// https://stackoverflow.com/questions/32155137/how-to-disable-chat-history-in-mozilla-thunderbird

defaultPref("purple.logging.log_chats", false);
defaultPref("purple.logging.log_ims", false);

/// Do not leak info in chat notifications by default

defaultPref("mail.chat.notification_info", 2);

lockPref("mail.dove.cfg.status", "003");

// 004 GENERAL NETWORK HARDENING

/// Enforce using secure connections for auto config

defaultPref("mailnews.auto_config.fetchFromISP.sslOnly", true);
defaultPref("mailnews.auto_config.guess.requireGoodCert", true); // [DEFAULT]
defaultPref("mailnews.auto_config.guess.sslOnly", true);

/// Disable sending usernames to your email provider when using auto config by default...
// https://searchfox.org/comm-central/source/mailnews/mailnews.js#1024

defaultPref("mailnews.auto_config.fetchFromISP.sendEmailAddress", false);

/// Disable link previews

defaultPref("mail.compose.add_link_preview", false);

/// Always warn when making insecure connections
// Unclear whether actually used anywhere

defaultPref("security.warn_entering_weak", true);
defaultPref("security.warn_leaving_secure", true);
defaultPref("security.warn_viewing_mixed", true);

lockPref("mail.dove.cfg.status", "004");

// 005 UI

/// Always show full email addresses

defaultPref("mail.showCondensedAddresses", false);

/// Always show email information & headers

defaultPref("mail.show_headers", 2);
defaultPref("mailnews.headers.showMessageId", true);
defaultPref("mailnews.headers.showOrganization", true);
defaultPref("mailnews.headers.showReferences", true);
defaultPref("mailnews.headers.showSender", true);
defaultPref("mailnews.headers.showUserAgent", true);

lockPref("mail.dove.cfg.status", "005");

// 006 INFORMATION LEAKAGE

/// Disable sending read receipts
// https://searchfox.org/comm-central/source/mailnews/mailnews.js#292

defaultPref("mail.mdn.report.enabled", false);
defaultPref("mail.mdn.report.not_in_to_cc", 0);
defaultPref("mail.mdn.report.outside_domain", 0);
defaultPref("mail.mdn.report.other", 0);
defaultPref("mail.server.default.mdn_not_in_to_cc", 0);
defaultPref("mail.server.default.mdn_other", 0);
defaultPref("mail.server.default.mdn_outside_domain", 0);
defaultPref("mail.server.default.mdn_report_enabled", false);
defaultPref("purple.conversations.im.send_read", false); // [CHAT]

/// Disable sending chat typing notifications

defaultPref("purple.conversations.im.send_typing", false);

/// Disable reporting chat idle status

defaultPref("messenger.status.reportIdle", false);

/// Prevent sending user agent with emails, as it is unnecessary, not even defined in spec, & leaks information
// https://bugzilla.mozilla.org/show_bug.cgi?id=1114475

defaultPref("mailnews.headers.sendUserAgent", false);
defaultPref("mailnews.headers.useMinimalUserAgent", true); // [DEFAULT, DEFENSE IN DEPTH]

/// Prevent leaking system locale & date/time in replies

defaultPref("mailnews.reply_header_authorwroteondate", "#1 wrote on #2 #3:");
defaultPref("mailnews.reply_header_authorwrotesingle", "#1 wrote:");
defaultPref("mailnews.reply_header_ondateauthorwrote", "On #2 #3, #1 wrote:");
defaultPref("mailnews.reply_header_type", 1);

/// Prevent leaking spellcheck dictionary info
// https://bugzilla.mozilla.org/show_bug.cgi?id=1370217

defaultPref("mail.suppress_content_language", true);

/// Prevent leaking locale & specific time through date header
// https://bugzilla.mozilla.org/show_bug.cgi?id=1603359

defaultPref("mail.sanitize_date_header", true);

lockPref("mail.dove.cfg.status", "006");

// 007 E2EE

/// Enable advanced E2EE settings
// https://searchfox.org/comm-central/source/mail/extensions/am-e2e/prefs/e2e-prefs.js#104

defaultPref("temp.openpgp.advancedUser", true);

/// Always notify when encryption is possible

defaultPref("mail.openpgp.remind_encryption_possible", true); // [DEFAULT]
defaultPref("mail.smime.remind_encryption_possible", true); // [DEFAULT]

/// Always automatically encrypt when possible

defaultPref("mail.e2ee.auto_enable", true);

/// Never automatically disable E2EE...
// https://searchfox.org/comm-central/source/mail/extensions/am-e2e/prefs/e2e-prefs.js#67

lockPref("mail.e2ee.auto_disable", false); // [DEFAULT]

/// Always notify when E2EE is disabled

lockPref("mail.e2ee.notify_on_auto_disable", true); // [DEFAULT]

/// Ensure we're not accepting insecure S/MIME signatures...
// https://searchfox.org/comm-central/source/mail/extensions/am-e2e/prefs/e2e-prefs.js#95

defaultPref("mail.smime.accept_insecure_sha1_message_signatures", false); // [DEFAULT]

/// Sign messages by default
/// https://searchfox.org/comm-central/source/mail/extensions/am-e2e/prefs/e2e-prefs.js#12

defaultPref("mail.identity.default.sign_mail", true);

/// Use GnuPG if built-in RNP fails
// https://wiki.mozilla.org/Thunderbird:OpenPGP:Smartcards#Allow_the_use_of_external_GnuP

defaultPref("mail.openpgp.allow_external_gnupg", true);

/// Always warn users when using a deprecated version of GnuPG...

defaultPref("temp.openpgp.warnDeprecatedGnuPG", true); // [DEFAULT]

lockPref("mail.dove.cfg.status", "007");

// 008 MISC. PRIVACY

/// Never load remote content in emails

lockPref("mailnews.message_display.disable_remote_image", true); // [DEFAULT]

/// Disable Geolocation

defaultPref("browser.geolocation.warning.infoURL", "");
defaultPref("geo.enabled", false);
defaultPref("geo.provider.network.url", "");
defaultPref("geo.provider.use_corelocation", false);
defaultPref("geo.provider.use_geoclue", false);
defaultPref("geo.provider.ms-windows-location", false);

/// Enable & Enforce ETP Strict Features (ETP Strict is not available on Thunderbird)

defaultPref("network.cookie.cookieBehavior", 5);
defaultPref("network.cookie.cookieBehavior.optInPartitioning", true);
defaultPref("network.cookie.cookieBehavior.pbmode", 5);
defaultPref("network.http.referer.disallowCrossSiteRelaxingDefault", true); // [DEFAULT]
defaultPref("network.http.referer.disallowCrossSiteRelaxingDefault.pbmode", true); // [DEFAULT]
defaultPref("network.http.referer.disallowCrossSiteRelaxingDefault.pbmode.top_navigation", true); // [DEFAULT]
defaultPref("network.http.referer.disallowCrossSiteRelaxingDefault.top_navigation", true);
defaultPref("privacy.bounceTrackingProtection.enabled", true); // [DEFAULT]
defaultPref("privacy.bounceTrackingProtection.mode", 1); // Fully enables Bounce Tracking Protection - https://searchfox.org/mozilla-central/source/toolkit/components/antitracking/bouncetrackingprotection/nsIBounceTrackingProtection.idl#11
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.fingerprintingProtection.pbmode", true);
defaultPref("privacy.partition.always_partition_third_party_non_cookie_storage", true); // [DEFAULT]
defaultPref("privacy.partition.always_partition_third_party_non_cookie_storage.exempt_sessionstorage", false); // [DEFAULT]
defaultPref("privacy.partition.bloburl_per_partition_key", true); // [DEFAULT]
defaultPref("privacy.partition.network_state.ocsp_cache", true); // [DEFAULT]
defaultPref("privacy.partition.network_state.ocsp_cache.pbmode", true); // [DEFAULT]
defaultPref("privacy.query_stripping.enabled", true);
defaultPref("privacy.query_stripping.enabled.pbmode", true);
defaultPref("privacy.socialtracking.bdefault_cookies.enabled", true);
defaultPref("privacy.trackingprotection.cryptomining.enabled", true);
defaultPref("privacy.trackingprotection.emailtracking.enabled", true);
defaultPref("privacy.trackingprotection.emailtracking.pbmode.enabled", true); // [DEFAULT]
defaultPref("privacy.trackingprotection.enabled", true);
defaultPref("privacy.trackingprotection.fingerprinting.enabled", true);
defaultPref("privacy.trackingprotection.pbmode.enabled", true); // [DEFAULT]
defaultPref("privacy.trackingprotection.socialtracking.enabled", true);

/// Override FPP targets
// We're adding -HttpUserAgent & -NavigatorUserAgent because they try to report that we're Firefox, which causes breakage and undesired behavior (ex. on the ATO...)

defaultPref("privacy.fingerprintingProtection.overrides", "+AllTargets,-CanvasExtractionBeforeUserInputIsBlocked,-CSSPrefersColorScheme,-FrameRate,-HttpUserAgent,-NavigatorUserAgent");

/// Reset Phoenix's FPP overrides + disable Mozilla's remote overrides
// These are meant for browsers and may have undesired privacy implications for our use case...

defaultPref("privacy.fingerprintingProtection.granularOverrides", ""); // [DEFAULT]
defaultPref("privacy.fingerprintingProtection.remoteOverrides.enabled", false);

/// Strip referers, but allow toggling per session, since they may be needed on rare occasions.

defaultPref("network.http.referer.XOriginPolicy", 0);
pref("network.http.referer.XOriginPolicy", 2);

/// Prevent leaking sensitive information from the Cardbook extension
// https://github.com/HorlogeSkynet/thunderbird-user.js/blob/master/user.js#L1231

defaultPref("extensions.cardbook.useOnlyEmail", true);

lockPref("mail.dove.cfg.status", "008");

// 009 MISC. SECURITY

/// Prevent 3rd party software from intercepting & analyzing your emails...
// This is the "Allow Antivirus clients to quarantine individual incoming messages" option within Privacy & Security settings...
// https://searchfox.org/comm-central/source/mail/components/MailGlue.sys.mjs#1299

lockPref("mailnews.downloadToTempFile", false);

/// Sanitize HTML content
// https://www.bucksch.org/1/projects/mozilla/108153/

defaultPref("mail.html_sanitize.drop_conditional_css", true); // [DEFAULT]
defaultPref("mailnews.display.html_as", 3);
defaultPref("rss.display.html_as", 3);

/// Enforce built-in phishing protection
// https://support.mozilla.org/kb/thunderbirds-scam-detection

defaultPref("mail.phishing.detection.disallow_form_actions", true); // [DEFAULT]
defaultPref("mail.phishing.detection.enabled", true); // [DEFAULT]
defaultPref("mail.phishing.detection.ipaddresses", true); // [DEFAULT]
defaultPref("mail.phishing.detection.mismatched_hosts", true); // [DEFAULT]

lockPref("mail.dove.cfg.status", "009");

// 010 MISC.

/// Send emails in plaintext by default
// https://drewdevault.com/2016/04/11/Please-use-text-plain-for-emails.html

defaultPref("mail.default_send_format", 1);
defaultPref("mail.html_compose", false);
defaultPref("mail.identity.default.compose_html", false);

/// By default, load summary of RSS feeds instead of the full webpage & prevent loading additional webpage content

defaultPref("rss.message.loadWebPageOnSelect", 0);
defaultPref("rss.show.summary", 1);

/// Do not allow calendar to extract data from emails by default

defaultPref("calendar.extract.service.enabled", false); // [DEFAULT]

/// Disable Web Notifications

defaultPref("dom.webnotifications.enabled", false);

/// Kill Gecko Media Plugins

defaultPref("media.gmp-gmpopenh264.enabled", false);
defaultPref("media.gmp-gmpopenh264.provider.enabled", false);
defaultPref("media.gmp-gmpopenh264.visible", false);
defaultPref("media.gmp-provider.enabled", false);

/// Always allow installing "incompatible" add-ons - REQUIRED FOR UBLOCK ORIGIN

lockPref("extensions.strictCompatibility", false);

/// Allow running uBlock Origin on sites with restrictions (Quarantined domains)
// Necessary since it isn't 'recommended' like it is on Firefox...

defaultPref("extensions.quarantineIgnoredByUser.uBlock0@raymondhill.net", true);

/// Disable SVG
// https://cve.mitre.org/cgi-bin/cvekey.cgi?keyword=firefox+svg

defaultPref("svg.disabled", true);

lockPref("mail.dove.cfg.status", "010");

// 011 Personal Touch 💜

/// Things that are nice to have™
// Not directly privacy & security related

/// Enable inline spellcheck when composing messages & check before sending by default

defaultPref("mail.spellcheck.inline", true); // [DEFAULT]
defaultPref("mail.SpellCheckBeforeSend", true);

/// Enable dark theme for the message pane

defaultPref("mail.dark-reader.enabled", true);

lockPref("mail.dove.cfg.status", "011");

// 012 DO NOT TOUCH

defaultPref("browser.privatebrowsing.autostart", false); // Breaks uBlock Origin & all other extensions... also unnecessary since we always sanitize data anyways
defaultPref("mailnews.oauth.usePrivateBrowser", false); // Breaks uBlock Origin & all other extensions... also unnecessary since we always sanitize data anyways

lockPref("mail.dove.cfg.status", "012");

lockPref("mail.dove.cfg.status", "successfully applied :D");
