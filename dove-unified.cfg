// Built from Phoenix (Extended)

// Determine our platform
/// (See: https://codeberg.org/celenity/Phoenix/issues/231)

/// If DOVE_HARDCODE_PLATFORM is set to 1 at build-time, we will hardcode the target platform, instead of trying to
// determine it automatically (from the checks below)
/// While our checks do seem to work reliably, it's safer to hardcode/set the platform directly, especially since we still currently
/// ship other OS-specific files anyways (ex. policies)
/// (See discussion at: https://codeberg.org/celenity/Phoenix/issues/231)
/// DOVE_PLATFORM_TO_HARDCODE is set by the build scripts
let dovePlatformToHardcode = "{DOVE_PLATFORM_TO_HARDCODE}";

// Ensure the platform (if set directly) is properly set to a recognized value
if (dovePlatformToHardcode == "linux" || dovePlatformToHardcode == "osx" || dovePlatformToHardcode == "windows") {
    lockPref("mail.dove.platform", `${dovePlatformToHardcode}`); // [FN]
    lockPref("mail.dove.platform.current", `${dovePlatformToHardcode}`); // [FN]
    lockPref("mail.dove.platformSet", true); // [FN]
    doveSetValidPlatform = true;
} else {
    defaultPref("mail.dove.platform", "unknown"); // [FN]
    defaultPref("mail.dove.platform.current", "unknown"); // [FN]
    defaultPref("mail.dove.platformSet", false); // [FN]
    doveSetValidPlatform = false;
};

if (doveSetValidPlatform != true) {
    try {
        // First, check the value of DOVE_HOST_PLATFORM
        if (getenv("DOVE_HOST_PLATFORM") == "linux") {
            DOVE_PLATFORM = 'linux'
        // We distinguish between OS X and OS X Intel later
        } else if (getenv("DOVE_HOST_PLATFORM") == "osx" || getenv("DOVE_HOST_PLATFORM") == "osx-intel") {
            DOVE_PLATFORM = 'osx'
        } else if (getenv("DOVE_HOST_PLATFORM") == "windows") {
            DOVE_PLATFORM = 'windows'

        // We can now try to fall-back to PHOENIX_HOST_PLATFORM
        // Not sure why PHOENIX_HOST_PLATFORM would be set if DOVE_HOST_PLATFORM isn't, but worth a try
        } else if (getenv("PHOENIX_HOST_PLATFORM") == "linux") {
            DOVE_PLATFORM = 'linux'
        } else if (getenv("PHOENIX_HOST_PLATFORM") == "osx" || getenv("PHOENIX_HOST_PLATFORM") == "osx-intel") {
            DOVE_PLATFORM = 'osx'
        } else if (getenv("PHOENIX_HOST_PLATFORM") == "windows") {
            DOVE_PLATFORM = 'windows'

        // Now, fall-back to system env variables...

        // If any of the following env variables are defined, we know we're on OS X:
        // __CFBundleIdentifier
        // MOZ_APP_NO_DOCK
        // MOZ_NO_GLOBAL_MOUSE_MONITOR
        // XPC_FLAGS
        // XPC_SERVICE_NAME
        } else if (getenv("__CFBundleIdentifier") || getenv("MOZ_APP_NO_DOCK") || getenv("MOZ_NO_GLOBAL_MOUSE_MONITOR") || getenv("XPC_FLAGS") || getenv("XPC_SERVICE_NAME")) {
            DOVE_PLATFORM = 'osx'
        // If any of the following env variables are defined, we know we're on Windows:
        // MOZ_ENABLE_WIN32K
        // OS (set to "Windows_NT")
        // PSModulePath
        // USERPROFILE
        // XRE_NO_DLL_READAHEAD
        // XRE_NO_WINDOWS_CRASH_DIALOG
        // windir
        } else if (getenv("OS") == "Windows_NT" || getenv("MOZ_ENABLE_WIN32K") || getenv("PSModulePath") || getenv("USERPROFILE") || getenv("XRE_NO_DLL_READAHEAD") || getenv("XRE_NO_WINDOWS_CRASH_DIALOG") || getenv("windir")) {
            DOVE_PLATFORM = 'windows'
        // If any of the following env variables are defined, we know we're on Linux:
        // DESKTOP_SESSION
        // FLATPAK_ID
        // GDK_BACKEND
        // GDMSESSION
        // GNOME_DESKTOP_SESSION_ID
        // GTK_USE_PORTAL
        // KDE_FULL_SESSION
        // LXQT_SESSION_CONFIG
        // MATE_DESKTOP_SESSION_ID
        // MOZ_DISABLE_WAYLAND_PROXY
        // MOZ_GDK_DISPLAY
        // MOZ_USE_XINPUT2
        // MOZ_X_SYNC
        // MOZ_X11_EGL
        // SNAP
        // SNAP_DESKTOP_RUNTIME
        // SNAP_INSTANCE_NAME
        // SNAP_NAME
        // SNAP_REAL_HOME
        // SYSTEMD_EXEC_PID
        // WAYLAND_DISPLAY
        // WAYLAND_PROXY_LOG
        // XDG_ACTIVATION_TOKEN
        // XDG_CACHE_HOME
        // XDG_CONFIG_DIRS
        // XDG_CONFIG_HOME
        // XDG_CURRENT_DESKTOP
        // XDG_DATA_DIRS
        // XDG_DATA_HOME
        // XDG_MENU_PREFIX
        // XDG_RUNTIME_DIR
        // XDG_SESSION_CLASS
        // XDG_SESSION_DESKTOP
        // XDG_SESSION_TYPE
        } else if (getenv("DESKTOP_SESSION") || getenv("FLATPAK_ID") || getenv("GDK_BACKEND") || getenv("GDMSESSION") || getenv("GNOME_DESKTOP_SESSION_ID") || getenv("GTK_USE_PORTAL") || getenv("KDE_FULL_SESSION") || getenv("LXQT_SESSION_CONFIG") || getenv("MATE_DESKTOP_SESSION_ID") || getenv("MOZ_DISABLE_WAYLAND_PROXY") || getenv("MOZ_GDK_DISPLAY") || getenv("MOZ_USE_XINPUT2") || getenv("MOZ_X_SYNC") || getenv("MOZ_X11_EGL") || getenv("SNAP") || getenv("SNAP_DESKTOP_RUNTIME") || getenv("SNAP_INSTANCE_NAME") || getenv("SNAP_NAME") || getenv("SNAP_REAL_HOME") || getenv("SYSTEMD_EXEC_PID") || getenv("WAYLAND_DISPLAY") || getenv("WAYLAND_PROXY_LOG") || getenv("XDG_ACTIVATION_TOKEN") || getenv("XDG_CACHE_HOME") || getenv("XDG_CONFIG_DIRS") || getenv("XDG_CONFIG_HOME") || getenv("XDG_CURRENT_DESKTOP") || getenv("XDG_DATA_DIRS") || getenv("XDG_DATA_HOME") || getenv("XDG_MENU_PREFIX") || getenv("XDG_RUNTIME_DIR") || getenv("XDG_SESSION_CLASS") || getenv("XDG_SESSION_DESKTOP") || getenv("XDG_SESSION_TYPE")) {
            DOVE_PLATFORM = 'linux'
        // At this point, we should really have our OS, but in case we don't for some reason, check prefs
        // In practice, these shouldn't be used
        } else if (getPref("browser.low_commit_space_threshold_percent") || getPref("media.ffmpeg.vaapi.force-surface-zero-copy") || getPref("widget.gtk.file-manager-show-items-timeout-ms")) {
            DOVE_PLATFORM = 'linux'
        } else if (getPref("network.dns.native_https_timeout_mac_msec") || getPref("widget.macos.shift-by-menubar-on-fullscreen") || getPref("widget.macos.automatic.text_substitution_fetch_length")) {
            DOVE_PLATFORM = 'osx'
        } else if (getPref("accessibility.windows.suppress-after-clipboard-copy") || getPref("accessibility.windows.suppress-for-snap-layout")) {
            DOVE_PLATFORM = 'windows'
        } else {
            DOVE_PLATFORM = 'unknown'
        }
    } catch (e) {
        DOVE_PLATFORM = 'unknown'
    };

    pref("mail.dove.platform.current", `${DOVE_PLATFORM}`);
    dovePlatformPrefCurrentValue = getPref("mail.dove.platform.current");

    if (getPref("mail.dove.platformSet") == false || getPref("mail.dove.platform") == "unknown") {
        pref("mail.dove.platform", `${dovePlatformPrefCurrentValue}`);
        pref("mail.dove.platformSet", true); 
    };
};

let dovePlatform = getPref("mail.dove.platform");

/// For OS X users, determine whether we're on Apple Silicon or Intel
if (dovePlatform == "osx") {
    /// DOVE_OSX_VARIANT_TO_HARDCODE is set by the build scripts
    doveOsXVariantToHardcode = "{DOVE_OSX_VARIANT_TO_HARDCODE}";

    // Ensure the OS X variant (if set directly) is properly set to a recognized value
    if (doveOsXVariantToHardcode == "silicon" || doveOsXVariantToHardcode == "intel") {
        lockPref("mail.dove.osx", `${doveOsXVariantToHardcode}`); // [FN]
        lockPref("mail.dove.osxCurrent", `${doveOsXVariantToHardcode}`); // [FN]
        lockPref("mail.dove.osxSet", true); // [FN]
        doveSetValidOsXVariant = true;
    } else {
        defaultPref("mail.dove.osx", "unknown"); // [FN]
        defaultPref("mail.dove.osxCurrent", "unknown"); // [FN]
        defaultPref("mail.dove.osxSet", false); // [FN]
        doveSetValidOsXVariant = false;
    };

    if (doveSetValidOsXVariant != true) {
        try {
            if (getenv("DOVE_HOST_PLATFORM") == "osx-intel") {
                DOVE_OSX = 'intel'
            } else if (getenv("DOVE_HOST_PLATFORM") == "osx") {
                DOVE_OSX = 'silicon'
            // We can try falling back to PHOENIX_HOST_PLATFORM
            } else if (getenv("PHOENIX_HOST_PLATFORM") == "osx-intel") {
                DOVE_OSX = 'intel'
            } else if (getenv("PHOENIX_HOST_PLATFORM") == "osx") {
                DOVE_OSX = 'silicon'
            } else {
                DOVE_OSX = 'unknown'
            };
        } catch (e) {
            DOVE_OSX = 'unknown'
        };

        pref("mail.dove.osxCurrent", `${DOVE_OSX}`); // [FN]
        doveOsxPrefCurrentValue = getPref("mail.dove.osxCurrent");

        if (getPref("mail.dove.osxSet") == false || getPref("mail.dove.osx") == "unknown") {
            pref("mail.dove.osx", `${doveOsxPrefCurrentValue}`); // [FN]
            pref("mail.dove.osxSet", true); // [FN]
        };
    };

    doveOSX = getPref("mail.dove.osx");
} else {
    doveOSX = 'not-osx';
};

/// Determine whether we're in ESR
defaultPref("mail.dove.esr", "unknown"); // [FN]
defaultPref("mail.dove.esrCurrent", "unknown"); // [FN]
defaultPref("mail.dove.esrSet", false); // [FN]

try {
    if (getPref("app.update.channel") == "esr") {
        DOVE_ESR = 'true'
    } else {
        DOVE_ESR = 'false'
    };
} catch (e) {
    DOVE_ESR = 'unknown'
};

pref("mail.dove.esrCurrent", `${DOVE_ESR}`); // [FN]
doveEsrPrefCurrentValue = getPref("mail.dove.esrCurrent");

if (getPref("mail.dove.esrSet") == false || getPref("mail.dove.esr") == "unknown") {
    pref("mail.dove.esr", `${doveEsrPrefCurrentValue}`); // [FN]
    pref("mail.dove.esrSet", true); // [FN]
};

if (getPref("mail.dove.esr") == "true") {
    doveESR = true;
} else {
    doveESR = false;
};

/// Determine whether we're in Nightly
defaultPref("mail.dove.nightly", "unknown"); // [FN]
defaultPref("mail.dove.nightlyCurrent", "unknown"); // [FN]
defaultPref("mail.dove.nightlySet", false); // [FN]

try {
    if (getPref("app.update.channel") == "nightly") {
        DOVE_NIGHTLY = 'true'
    } else {
        DOVE_NIGHTLY = 'false'
    };
} catch (e) {
    DOVE_NIGHTLY = 'unknown'
};

pref("mail.dove.nightlyCurrent", `${DOVE_NIGHTLY}`); // [FN]
doveNightlyPrefCurrentValue = getPref("mail.dove.nightlyCurrent");

if (getPref("mail.dove.nightlySet") == false || getPref("mail.dove.nightly") == "unknown") {
    pref("mail.dove.nightly", `${doveNightlyPrefCurrentValue}`); // [FN]
    pref("mail.dove.nightlySet", true); // [FN]
};

if (getPref("mail.dove.nightly") == "true") {
    doveNightly = true;
} else {
    doveNightly = false;
};

// DOVE_VERSION is set by the build scripts
lockPref("mail.dove.version", "{DOVE_VERSION}");

