// For first-run tasks
defaultPref("mail.dove.firstRun.complete", false); // [FN]

// On first run, to grant ATN-XPIHandler permission to access addons.thunderbird.net,
/// we unfortunately need to enable granting MV3 extensions optional host permissions by default.
/// But we only need this for the first run, since once the permission is granted, it will persist.
if (getPref("mail.dove.firstRun.complete") == false) {
    defaultPref("extensions.originControls.grantByDefault", true); // [FN]
    pref("mail.dove.firstRun.complete", true); // [FN]
};

/*** BRANDING ***/

// Add custom branding at `about:support`
/// DOVE_VERSION and PHOENIX_VERSION are set by the build scripts
defaultPref("app.support.vendor", "Dove: {DOVE_VERSION} | Phoenix - Extended: {PHOENIX_VERSION}"); // [HIDDEN]

// Add custom branding under `Thunderbird Updates` at `about:preferences#general`
/// This will unfortunately only display if `distribution.id` and `distribution.version` are set properly
/// DOVE_VERSION is set by the build scripts
lockPref("distribution.about", "Dove for Mozilla Thunderbird - {DOVE_VERSION} 💜"); // [HIDDEN]

// Distribution ID and version must be set for `distribution.about` to display
/// `default` matches Mozilla's stock/default value - setting this to anything else could potentially compromise privacy (as this value is shared with Mozilla via the browser update endpoint)
/// Since Mozilla doesn't provide special builds that use different values here (like Firefox), we can safely set these everywhere
lockPref("distribution.id", "default"); // [HIDDEN]
lockPref("distribution.version", "default"); // [HIDDEN]

defaultPref("mail.dove.status", "000");

/*** 001 DATA COLLECTION ***/

/// Disable Ecosystem Telemetry
// https://firefox-source-docs.mozilla.org/toolkit/components/telemetry/obsolete/ecosystem-telemetry.html
lockPref("toolkit.telemetry.ecosystemtelemetry.enabled", false); // [DEFAULT - non-Nightly]

defaultPref("mail.dove.status", "001");

/*** 002 MOZILLA CRAP™ ***/

/// Clear unnecessary/undesired Mozilla URLs
defaultPref("mail.pgpmime.addon_url", ""); // Contains a link to Enigmail - a now dead extension that used to provide E2EE for Thunderbird (before it was built-in like it is nowadays...) - Likely not used anywhere
defaultPref("toolkit.crashreporter.infoURL", "");

/// Disable Donation Prompts
// Please still donate to Thunderbird if you appreciate it! ;)
// https://www.thunderbird.net/?form=support
lockPref("app.donation.eoy.url", "");
lockPref("app.donation.eoy.version.viewed", 99);

/// Disable the Email Provisioner
// Used for creating new email addresses with Mozilla's "partners"
defaultPref("mail.provider.enabled", false);
defaultPref("mail.provider.suppress_dialog_on_startup", true); // [HIDDEN]

/// Disable Filelink
// https://support.mozilla.org/kb/filelink-large-attachments
defaultPref("mail.cloud_files.enabled", false);

/// Disable 'In-App Notifications'
// https://searchfox.org/comm-central/source/mail/components/inappnotifications/docs/index.md
lockPref("mail.inappnotifications.blog_enabled", false); // Surveys
lockPref("mail.inappnotifications.donation_enabled", false); // Donation prompts/fundraisers
defaultPref("mail.inappnotifications.enabled", false);
lockPref("mail.inappnotifications.message_enabled", false); // Updates

/// Disable onboarding
// https://searchfox.org/comm-central/source/suite/components/nsSuiteGlue.js#965
defaultPref("browser.EULA.override", true);
defaultPref("browser.rights.override", true);
defaultPref("mail.rights.override", true); // [DEFAULT - Debug/non-MOZILLA_OFFICIAL builds]
lockPref("mailnews.start_page_override.mstone", "ignore");

/// Disable recommendations
defaultPref("extensions.getAddons.recommended.url", "");

/// Disable start page by default and switch the URL to `about:config`
// This allows users to easily access `about:config` via the menu bar from `Go` -> `Mail Start Page`
// Or by pressing alt + home
defaultPref("mailnews.start_page.enabled", false);
defaultPref("mailnews.start_page.override_url", "");
defaultPref("mailnews.start_page.url", "about:config");

/// Disable surveys
lockPref("app.survey.version.viewed", 99); // [HIDDEN]

/// Prevent checking if Thunderbird is the default mail client
defaultPref("mail.shell.checkDefaultClient", false);

/// Prevent checking if Thunderbird is the default PDF viewer
defaultPref("pdfjs.firstRun", false);

/// Remove Mozilla partner/search parameter
// https://searchfox.org/comm-central/source/mozilla/toolkit/components/search/AppProvidedSearchEngine.sys.mjs
// https://searchfox.org/comm-central/source/mail/branding/include/release-prefs.js
lockPref("browser.search.param.ms-pc", "");

/// Remove tracking parameters from Mozilla URLs + prevent exposing locale & unnecessary information
// For info on the extension update (`extensions.update.`) URL parameters, see https://devdoc.net/web/developer.mozilla.org/en-US/docs/Install_Manifests.html & https://mozilla-balrog.readthedocs.io/en/latest/database.html
lockPref("app.releaseNotesURL", "https://www.thunderbird.net/releases");
lockPref("app.releaseNotesURL.aboutDialog", "https://www.thunderbird.net/releases");
lockPref("app.releaseNotesURL.prompt", "https://www.thunderbird.net/releases");
lockPref("app.vendorURL", "https://www.thunderbird.net/");
defaultPref("browser.dictionaries.download.url", "https://addons.thunderbird.net/language-tools/");
defaultPref("extensions.getAddons.compatOverides.url", "https://services.addons.thunderbird.net/api/v4/addons/compat-override/?guid=%IDS%"); // Also updates to the newer v4 API (default is still v3...) - https://mozilla.github.io/addons-server/topics/api/overview.html#api-versions - though I doubt this URL is used anywhere
defaultPref("extensions.getAddons.link.url", "https://addons.thunderbird.net/");
defaultPref("extensions.getAddons.search.browseURL", "https://addons.thunderbird.net/search/?q=%TERMS%");
defaultPref("extensions.getAddons.search.url", "https://services.addons.thunderbird.net/api/%API_VERSION%/search/%TERMS%/all/%MAX_RESULTS%/");
defaultPref("extensions.update.background.url", "https://versioncheck-bg.addons.thunderbird.net/update/VersionCheck.php?reqVersion=%REQ_VERSION%&id=%ITEM_ID%&version=%ITEM_VERSION%&status=%ITEM_STATUS%&appID=%APP_ID%&appVersion=%APP_VERSION%&currentAppVersion=%CURRENT_APP_VERSION%&updateType=%UPDATE_TYPE%"); // Removes maximum app/browser version (maxAppVersion), operating system (appOS), ABI (appABI), locale (locale), and compatibility mode (compatMode)
defaultPref("extensions.update.url", "https://versioncheck.addons.thunderbird.net/update/VersionCheck.php?reqVersion=%REQ_VERSION%&id=%ITEM_ID%&version=%ITEM_VERSION%&status=%ITEM_STATUS%&appID=%APP_ID%&appVersion=%APP_VERSION%&currentAppVersion=%CURRENT_APP_VERSION%&updateType=%UPDATE_TYPE%"); // Removes maximum app/browser version (maxAppVersion), operating system (appOS), ABI (appABI), locale (locale), and compatibility mode (compatMode)
defaultPref("mail.cloud_files.learn_more_url", "https://support.mozilla.org/kb/filelink-large-attachments");
defaultPref("mail.ignore_thread.learn_more_url", "https://support.mozilla.org/kb/ignore-threads");
defaultPref("spellchecker.dictionaries.download.url", "https://addons.thunderbird.net/language-tools/");

defaultPref("mail.dove.status", "002");

/*** 003 TRACKING PROTECTION ***/

/// Ensure no domains can bypass privacy controls (like mailnews.message_display.disable_remote_image) by default
// https://searchfox.org/comm-central/rev/ed9d9054/mailnews/mailnews.js#802
defaultPref("mail.trusteddomains", ""); // [DEFAULT]

/// Prevent messages from loading remote content
// This still allows adding exceptions
// https://support.mozilla.org/kb/remote-content-in-messages
lockPref("mailnews.message_display.disable_remote_image", true); // [DEFAULT]

defaultPref("mail.dove.status", "003");

/*** 004 INFORMATION LEAKAGE ***/

/// Disable CLIENTID
// https://bugzilla.mozilla.org/show_bug.cgi?id=1565379
// https://searchfox.org/comm-central/rev/19254da8/mailnews/mailnews.js#499
// https://searchfox.org/comm-central/rev/19254da8/mailnews/mailnews.js#496
defaultPref("mail.server.default.clientid", ""); // [DEFAULT]
defaultPref("mail.server.default.clientidEnabled", false); // [DEFAULT]
defaultPref("mail.smtpserver.default.clientid", ""); // [DEFAULT]
defaultPref("mail.smtpserver.default.clientidEnabled", false); // [DEFAULT]

/// Disable reporting chat idle status [CHAT]
defaultPref("messenger.status.reportIdle", false); // [CHAT]

/// Disable reporting chat status as 'away' when idle [CHAT]
// Defense in depth
defaultPref("messenger.status.awayWhenIdle", false); // [CHAT]

/// Disable sending chat typing notifications [CHAT]
defaultPref("purple.conversations.im.send_typing", false); // [CHAT]

/// Disable sending read receipts
defaultPref("mail.mdn.report.enabled", false);
defaultPref("mail.mdn.report.not_in_to_cc", 0);
defaultPref("mail.mdn.report.outside_domain", 0);
defaultPref("mail.mdn.report.other", 0);
defaultPref("mail.server.default.mdn_not_in_to_cc", 0);
defaultPref("mail.server.default.mdn_other", 0);
defaultPref("mail.server.default.mdn_outside_domain", 0);
defaultPref("mail.server.default.mdn_report_enabled", false);
defaultPref("purple.conversations.im.send_read", false); // [CHAT]

/// Disable sending user agent with emails
// Unnecessary, not defined in spec, and leaks information
// https://bugzilla.mozilla.org/show_bug.cgi?id=1114475
defaultPref("mailnews.headers.sendUserAgent", false);
defaultPref("mailnews.headers.useMinimalUserAgent", true); // [DEFENSE IN DEPTH] [DEFAULT]

/// Disable submission of IMAP RFC 2971 ID info
// https://datatracker.ietf.org/doc/html/rfc2971
// Used for analytics/data collection by design:
// "The ID extension to the Internet Message Access Protocol - Version4rev1(IMAP4rev1) protocol allows the server and client to exchange identification information on their implementation in order to make bug reports and usage statistics more complete."
// https://searchfox.org/comm-central/rev/19254da8/mailnews/mailnews.js#548
defaultPref("mail.server.default.send_client_info", false);

/// Prevent leaking local IP addresses with emails via EHLO/HELO
// https://blog.plee.me/2014/11/mozilla-thunderbird-changing-the-ehlo-helo-value-in-the-received-header-for-outgoing-mail/
defaultPref("mail.smtpserver.default.hello_argument", "[127.0.0.1]"); // [HIDDEN]

/// Prevent leaking locale and date/time in email replies
defaultPref("mailnews.reply_header_authorwroteondate", "#1 wrote on #2 #3:");
defaultPref("mailnews.reply_header_authorwrotesingle", "#1 wrote:");
defaultPref("mailnews.reply_header_ondateauthorwrote", "On #2 #3, #1 wrote:");
defaultPref("mailnews.reply_header_type", 1);

/// Prevent leaking locale and time with emails through the date header
// https://bugzilla.mozilla.org/show_bug.cgi?id=1603359
defaultPref("mail.sanitize_date_header", true);

/// Prevent leaking spellcheck dictionary info with emails
// https://bugzilla.mozilla.org/show_bug.cgi?id=1370217
defaultPref("mail.suppress_content_language", true);

/// Prevent sending usernames to your email provider as part of Autoconfiguration
// https://searchfox.org/comm-central/source/mailnews/mailnews.js#1024
defaultPref("mailnews.auto_config.fetchFromISP.sendEmailAddress", false);

defaultPref("mail.dove.status", "004");

/*** 005 FINGERPRINTING PROTECTION ***/

/// Ensure we always report "video-dynamic-range" as "standard"
// This does the same thing as the 'CSSVideoDynamicRange' RFP/FPP target (so it shouldn't interfere with FPP/RFP) - but I also want to set this here to ensure users are always protected if they disable FPP for whatever reason, and because we simply don't need this functionality at all for our use case...
// https://searchfox.org/mozilla-central/rev/20fc11f1/layout/style/nsMediaFeatures.cpp#345
// https://developer.mozilla.org/docs/Web/CSS/@media/video-dynamic-range
defaultPref("layout.css.video-dynamic-range.allows-high", false); // [DEFAULT - Windows]

defaultPref("mail.dove.status", "005");

/*** 006 DISK AVOIDANCE ***/

/// Disable browsing history
defaultPref("places.history.enabled", false);

/// Disable disk cache
// https://searchfox.org/comm-central/rev/19254da8/mailnews/mailnews.js#1072
defaultPref("mail.imap.use_disk_cache2", false);

