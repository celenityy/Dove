/// Disable OS file indexing/search integration for email by default
defaultPref("searchintegration.enable", false);

/// Disable Windows file indexing for email by default
if (dovePlatform == "windows") {
    defaultPref("mail.winsearch.enable", false); // [WINDOWS-ONLY] [DEFAULT]
    defaultPref("mail.winsearch.firstRunDone", true); // [WINDOWS-ONLY]
};

/// Do not try to submit unrecognized search/URL strings to the default search engine
defaultPref("keyword.enabled", false);

/// Package Thunderbird's Autoconfiguration files locally
// By default, these are typically fetched remotely from here: https://autoconfig.thunderbird.net/v1.1/
// Using these locally improves privacy by avoiding the unwanted network activity/potential leakage, and improves performance/responsiveness
// https://wiki.mozilla.org/Thunderbird:Autoconfiguration
if (dovePlatform == "linux") {
    defaultPref("mailnews.auto_config_url", "file:///etc/thunderbird/dove/assets/autoconfig/v1.1/"); // [LINUX-NON-FLATPAK-ONLY]
} else if (dovePlatform == "osx") {
    if (doveOSX == "intel") {
        defaultPref("mailnews.auto_config_url", "file:///usr/local/opt/dove-intel/assets/autoconfig/v1.1/"); // [INTEL-OSX-ONLY]
    } else {
        defaultPref("mailnews.auto_config_url", "file:///opt/homebrew/opt/dove/assets/autoconfig/v1.1/"); // [SILICON-OSX-ONLY]
    };
} else if (dovePlatform == "windows") {
    defaultPref("mailnews.auto_config_url", "file:///C:/dove/assets/autoconfig/v1.1/"); // [WINDOWS-ONLY]
} else {
    defaultPref("mailnews.auto_config_url", "file:///app/etc/thunderbird/dove/assets/autoconfig/v1.1/"); // [FLATPAK-LINUX-ONLY]
};

/// Prevent calendar from extracting data from emails by default
defaultPref("calendar.extract.service.enabled", false); // [DEFAULT]

/// Remove default Google Groups link
defaultPref("mailnews.messageid_browser.url", "");

/// (Attempt to) Unbreak Tracking Protection list downloads
// The default is `moz-sbrs:://antitracking`, which fetches these lists from Remote Settings - but the problem is that Thunderbird's Remote Settings unfortunately doesn't ship the Tracking Protection lists like Firefox
// So this switches the URL to try downloading them directly from Mozilla
defaultPref("browser.safebrowsing.provider.mozilla.updateURL", "https://shavar.services.mozilla.com/downloads?client=navclient-auto-ffox&appver=%VERSION%&pver=2.2");

/// Warn users if they have not addressed a BCC (Blind Carbon Copy) warning
defaultPref("mail.compose.warn_public_recipients.aggressive", true);

defaultPref("mail.dove.status", "016");

