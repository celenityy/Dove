defaultPref("mail.phishing.detection.enabled", true); // [DEFAULT]
defaultPref("mail.phishing.detection.ipaddresses", true); // [DEFAULT]
defaultPref("mail.phishing.detection.mismatched_hosts", true); // [DEFAULT]

/// Limit classes that can process incoming data
