/// Switch Remote Settings to use Firefox's server instead of Thunderbird's
// NOTE: This will ONLY work if you set the `MOZ_REMOTE_SETTINGS_DEVTOOLS` environment variable to `1` (If `MOZ_REMOTE_SETTINGS_DEVTOOLS` isn't set, Thunderbird will just continue to use its default server)
// Thunderbird's Remote Settings instance has little to no use, hasn't been updated since ~2022, etc...
// Using Firefox's server instead of Thunderbird's allows us to download and take advantage of add-on blocklists, certificate intermediates, certificate revocations, CRLite, tracking protection lists, etc... and doesn't appear to cause issues or undesired behavior.
// For testing: https://github.com/mozilla-extensions/remote-settings-devtools
lockPref("services.settings.server", "https://firefox.settings.services.mozilla.com/v1");

// Enable + hard-fail OCSP revocation checks if we can't use CRLite
/// So, CRLite is currently broken with Thunderbird's Remote Settings (meaning we unfortunately still need OCSP),
/// but it does work if users set the MOZ_REMOTE_SETTINGS_DEVTOOLS env variable and set the server to Firefox's
/// (https://firefox.settings.services.mozilla.com/v1). At some point, we need to figure out if we can set MOZ_REMOTE_SETTINGS_DEVTOOLS directly
/// But, for now, we can manually check whether the env and prefs are set; and if so, disable OCSP accordingly
/// NOTE: Nightly doesn't require setting "MOZ_REMOTE_SETTINGS_DEVTOOLS" here
if ((getenv("MOZ_REMOTE_SETTINGS_DEVTOOLS") == 1 || doveNightly == true) && getPref("services.settings.server") == "https://firefox.settings.services.mozilla.com/v1") {
    defaultPref("security.OCSP.enabled", 0); // [FN]
    defaultPref("security.OCSP.require", false); // [FN]
} else {
    defaultPref("security.OCSP.enabled", 1); // [DEFAULT]
    defaultPref("security.OCSP.require", true);
};

