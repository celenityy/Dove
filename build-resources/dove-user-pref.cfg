// This file contains Dove's "user" prefs, as it's not really possible to set those with the standard `.js` pref files
// See `dove-unified.js` (or `dove.js`/`dove-desktop.js` if you're looking at this locally...) for info on these prefs/why they're included.

/// So, on first run, to grant ATN-XPIHandler permission to access addons.thunderbird.net,
// we unfortunately need to enable granting MV3 extensions optional host permissions by default.
// But we only need this for the first run, since once the permission is granted, it will persist.
defaultPref("mail.dove.firstRun.complete", false);

if (getPref("mail.dove.firstRun.complete") == false) {
    defaultPref("extensions.originControls.grantByDefault", true);
    pref("mail.dove.firstRun.complete", true);
};

pref("devtools.debugger.pending-selected-location", "{}");
pref("devtools.debugger.remote-enabled", false);
pref("devtools.netmonitor.requestfilter", "");
pref("nimbus.profileId", "");
pref("xpinstall.enabled", false);

// Deregister the Glean add-on ping scheduler
clearPref("app.update.lastUpdateTime.glean-addons-daily");

clearPref("browser.safebrowsing.provider.ironfox.lastupdatetime");
clearPref("browser.safebrowsing.provider.ironfox.nextupdatetime");
clearPref("extensions.quarantinedDomains.list");

lockPref("mail.dove.applied.userCfg", true);
