defaultPref("privacy.clearOnShutdown.downloads", true); // [HIDDEN - Android/Thunderbird]
defaultPref("privacy.clearOnShutdown.history", true); // [HIDDEN - Android/Thunderbird]
defaultPref("privacy.clearOnShutdown.sessions", true); // [HIDDEN - Android/Thunderbird]
