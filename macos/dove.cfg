defaultPref("browser.safebrowsing.features.downloads.update", true); // [DEFAULT, HIDDEN]
defaultPref("browser.safebrowsing.features.malware.update", true); // [DEFAULT, HIDDEN - non-Android]
defaultPref("browser.safebrowsing.features.phishing.update", true); // [DEFAULT, HIDDEN - non-Android] 
defaultPref("browser.safebrowsing.malware.enabled", true); // [DEFAULT]
defaultPref("browser.safebrowsing.phishing.enabled", true); // [DEFAULT]
defaultPref("browser.safebrowsing.update.enabled", true); // [DEFAULT, HIDDEN]
defaultPref("urlclassifier.downloadAllowTable", "goog-downloadwhite-proto"); // [DEFAULT - non-Android]
